<!DOCTYPE HTML>
<html>
    <head>
        <title>Challenge: Write a Poem</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Morning Light</h1>
        
        <p>
            The sun creeps softly through the sky,<br>
            A golden hush goes drifting by.<br>
            The world awakes, calm and slow,<br>
            Wrapped in morning’s gentle glow.
        </p>
    </body>
