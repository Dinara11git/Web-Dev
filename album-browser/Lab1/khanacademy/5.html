<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Colorful creature</title>
        
        <style>
            body {
                background-color: rgb(189, 255, 244);
            }
            
            p {
                color: rgb(30, 90, 30);
            }
            
            h1 {
                color: rgb(0, 100, 60);
            }
        </style>
        
    </head>
    <body>
        
        <h1>The coolest creature</h1>
        
        <img src="https://www.kasandbox.org/programming-images/animals/chameleon.png" 
             alt="A colorful chameleon">
        
        <p>
            The <em>chameleon</em> is awesome because <strong>it can change its colors to blend into its surroundings</strong>.
        </p>
        
    </body>
</html>
